name: Python Code Quality & Syntax Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Cambia según la versión de tu proyecto

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8

    - name: Verificación estricta de errores de sintaxis (Linter)
      run: |
        # Detiene el proceso si hay errores de sintaxis en Python o variables no definidas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Revisión general de estilo y legibilidad
      run: |
        # Revisa mala escritura o formato sucio (advierte sin detener la ejecución de manera agresiva)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
